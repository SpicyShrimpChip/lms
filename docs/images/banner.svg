<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">ai-lms</title>
  <desc id="desc">학습 대시보드의 한 장면: 개념별 숙련도 막대(코드가 계산한 값)와 AI가 쓴 설명</desc>
  <defs>
    <style>
      .t { font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
    </style>
  </defs>

  <!-- 바탕: 서비스와 같은 상아색 -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="#f9f6ee" stroke="#e4ddcd"/>

  <!-- 왼쪽: 이름과 한 줄 소개 -->
  <text x="64" y="132" class="t" font-size="64" font-weight="800" fill="#0f2163">ai-lms</text>
  <text x="66" y="184" class="t" font-size="25" font-weight="600" fill="#1f3a8a">AI와 나눈 공부 대화로</text>
  <text x="66" y="220" class="t" font-size="25" font-weight="600" fill="#1f3a8a">내가 아는 개념과 모르는 개념을</text>
  <text x="66" y="256" class="t" font-size="25" font-weight="600" fill="#1f3a8a">근거와 함께 보여 줍니다</text>

  <!-- 오른쪽: 학습 대시보드 축소판 -->
  <rect x="640" y="36" width="512" height="268" rx="12" fill="#ffffff" stroke="#e4ddcd"/>
  <text x="668" y="72" class="t" font-size="15" font-weight="700" fill="#0d1b57">운영체제 개념별 숙련도</text>

  <!-- 행 1: 강점 -->
  <text x="668" y="110" class="t" font-size="15" fill="#1f2937">프로세스와 스레드</text>
  <rect x="820" y="100" width="170" height="10" rx="5" fill="#e8effc"/>
  <rect x="820" y="100" width="139" height="10" rx="5" fill="#3168d2"/>
  <text x="1000" y="110" class="t" font-size="14" font-weight="700" fill="#3168d2">82</text>
  <rect x="1040" y="92" width="76" height="26" rx="13" fill="#dcfce7"/>
  <path d="M1053 105 l4 4 l8 -8" fill="none" stroke="#166534" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1070" y="110" class="t" font-size="13" font-weight="700" fill="#166534">강점</text>

  <!-- 행 2: 보완 필요 -->
  <text x="668" y="150" class="t" font-size="15" fill="#1f2937">교착 상태</text>
  <rect x="820" y="140" width="170" height="10" rx="5" fill="#e8effc"/>
  <rect x="820" y="140" width="70" height="10" rx="5" fill="#3168d2"/>
  <text x="1000" y="150" class="t" font-size="14" font-weight="700" fill="#3168d2">41</text>
  <rect x="1028" y="132" width="100" height="26" rx="13" fill="#ffedd5"/>
  <circle cx="1045" cy="145" r="7" fill="none" stroke="#9a3412" stroke-width="1.8"/>
  <path d="M1045 141 v4.5 M1045 148.5 v0.5" stroke="#9a3412" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1058" y="150" class="t" font-size="13" font-weight="700" fill="#9a3412">보완 필요</text>

  <!-- 행 3: 보통 -->
  <text x="668" y="190" class="t" font-size="15" fill="#1f2937">페이지 교체</text>
  <rect x="820" y="180" width="170" height="10" rx="5" fill="#e8effc"/>
  <rect x="820" y="180" width="107" height="10" rx="5" fill="#3168d2"/>
  <text x="1000" y="190" class="t" font-size="14" font-weight="700" fill="#3168d2">63</text>

  <!-- AI 설명 상자 (보라 = AI가 쓴 글) -->
  <rect x="668" y="212" width="456" height="72" rx="10" fill="#fbf4fe" stroke="#e9b8f5"/>
  <path d="M690 230 l2.2 5.8 l5.8 2.2 l-5.8 2.2 l-2.2 5.8 l-2.2 -5.8 l-5.8 -2.2 l5.8 -2.2 z" fill="#86198f"/>
  <text x="704" y="242" class="t" font-size="13" font-weight="800" fill="#86198f">AI</text>
  <text x="684" y="266" class="t" font-size="14" fill="#1f2937">교착 상태를 두 번 다시 물어봤어요. 예제 문제부터 풀어 보세요.</text>
</svg>
