<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai-lms</title>
    <script>
      // 화면을 그리기 전에 다크모드를 먼저 적용해 흰 화면이 번쩍이지 않게 한다
      // (저장 키·값 형식은 src/store/useThemeStore.ts와 같아야 한다)
      try {
        var saved = JSON.parse(localStorage.getItem('ai-lms-theme') || '{}');
        var preference = (saved.state && saved.state.preference) || 'system';
        var dark =
          preference === 'dark' ||
          (preference === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {
        // 저장소를 읽지 못하면 밝은 모드로 둔다
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
