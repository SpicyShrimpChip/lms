name: Frontend CI

# main 대상 push·PR 중 frontend 변경이 있을 때만 실행
on:
  push:
    branches: ["main"]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

# 같은 브랜치에서 새 실행이 시작되면 이전 실행 취소
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "24" # 로컬 개발 환경과 맞춤
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 패키지 설치
        run: npm ci

      - name: ESLint 검사
        run: npm run lint

      - name: 빌드 확인
        run: npm run build