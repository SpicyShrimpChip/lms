name: Frontend CI

# main 대상 모든 PR에서 실행한다. build-and-lint가 main 보호의 필수 검사라서 PR에는 경로 필터를 걸지 않는다
# (필터가 있으면 frontend 밖만 바꾼 PR은 검사가 안 돌아 머지가 막힌다)
# push는 frontend 변경이 있을 때만 실행
on:
  push:
    branches: ["main"]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: ["main"]

# 같은 브랜치에서 새 실행이 시작되면 이전 실행 취소
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "24" # 로컬 개발 환경과 맞춤
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 패키지 설치
        run: npm ci

      - name: ESLint 검사
        run: npm run lint

      - name: 테스트
        run: npm test

      - name: 빌드 확인
        run: npm run build