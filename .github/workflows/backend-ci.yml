name: Backend CI

# main 대상 push·PR 중 backend 변경이 있을 때만 실행
on:
  push:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

# 같은 브랜치에서 새 실행이 시작되면 이전 실행 취소
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드와 테스트
        run: ./gradlew build
