name: Backend CI

# main 대상 push·PR 중 backend 변경이 있을 때만 실행
#
# 아직 main 보호의 필수 검사가 아니다(규칙셋 "backend CI required"는 만들어 두고 꺼 둠). 필수로 켜려면 순서대로:
#   1) 이 파일의 pull_request에서 paths 줄을 지운다(필터가 있으면 backend 밖만 바꾼 PR이 머지되지 않는다)
#   2) GitHub Settings → Rules → Rulesets → "backend CI required"를 Active로 바꾼다
# 필수 검사 이름은 job 이름과 같아야 한다(build-and-test, postgres-test). job 이름을 바꾸면 규칙셋도 같이 고친다
on:
  push:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

# 같은 브랜치에서 새 실행이 시작되면 이전 실행 취소
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # H2 메모리 DB로 빌드·전체 테스트
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      # gradle-wrapper.jar가 공식 배포본인지 확인한다
      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v4

      - name: 빌드·테스트
        run: ./gradlew build --no-daemon

  # 같은 테스트를 실제 PostgreSQL 16(로컬 backend/db/compose.yaml과 같은 버전)으로 실행: Flyway 마이그레이션, UNIQUE 제약, UTF-8 확인
  postgres-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          # 작업이 끝나면 사라지는 CI 전용 임시 컨테이너의 값이라 비밀값이 아니다
          POSTGRES_PASSWORD: ci-root-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/ai_lms_test
      DB_USERNAME: ai_lms_app
      DB_PASSWORD: ci-app-password
      DB_MIGRATION_USERNAME: ai_lms_migrator
      DB_MIGRATION_PASSWORD: ci-migrator-password

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      # 로컬 setup-local-postgres.sh와 같은 구성(DB UTF-8, 계정 2개, 마이그레이션 계정이 DB 소유자, 앱 계정은 읽기·쓰기만)
      - name: 테스트 DB·계정 만들기
        env:
          PGPASSWORD: ci-root-password
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ai_lms_migrator LOGIN PASSWORD 'ci-migrator-password';
          CREATE ROLE ai_lms_app LOGIN PASSWORD 'ci-app-password';
          CREATE DATABASE ai_lms_test OWNER ai_lms_migrator ENCODING 'UTF8' TEMPLATE template0;
          REVOKE ALL ON DATABASE ai_lms_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE ai_lms_test TO ai_lms_app;
          SQL
          psql -h 127.0.0.1 -U postgres -d ai_lms_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO ai_lms_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE ai_lms_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ai_lms_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE ai_lms_migrator IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO ai_lms_app;
          SQL

      - name: PostgreSQL 통합 테스트
        run: |
          # 실행할 때마다 새 JWT 키를 만든다 (저장하지 않음)
          export JWT_SECRET="$(openssl rand -base64 48)"
          ./gradlew postgresTest --no-daemon
