# 로컬 개발용 PostgreSQL. Docker Desktop을 켜 두고 backend/db 폴더에서 실행한다:
#   cd backend/db
#   POSTGRES_PASSWORD=<관리자 비밀번호> docker compose up -d     (PowerShell: $env:POSTGRES_PASSWORD="..."; docker compose up -d)
#   ./setup-local-postgres.sh                                  (DB·계정 만들기, 처음 한 번만)
# 껐다 켤 때는 `docker start lms` / `docker stop lms`. 비밀번호는 처음 컨테이너를 만들 때만 쓰이고 볼륨에 저장된다.
#
# - 내 PC에서만 접속되게 127.0.0.1에만 연다
# - 데이터는 볼륨 ai_lms_data에 남는다. 컨테이너를 지워도 유지되고, 완전히 지우려면 `docker volume rm ai_lms_data`
# - 버전은 CI(backend-ci.yml)와 같게 맞춘다. 올릴 때 두 곳을 함께 고친다
name: ai-lms

services:
  postgres:
    image: postgres:16
    container_name: lms
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 환경변수에 관리자 비밀번호를 넣어 주세요}
    volumes:
      - ai_lms_data:/var/lib/postgresql/data

volumes:
  ai_lms_data:
    name: ai_lms_data
