# 로컬 PostgreSQL 프로필 (./gradlew bootRun 기본값). 계정·비밀번호는 backend/.env 또는 환경변수에서 읽는다.
# DB와 계정은 backend/db/setup-local-postgres.sh로 만든다 (컨테이너는 backend/db/compose.yaml)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_lms}
    # 앱 계정: 데이터 읽기·쓰기(SELECT, INSERT, UPDATE, DELETE)만 할 수 있다
    username: ${DB_USERNAME:ai_lms_app}
    password: ${DB_PASSWORD}

  # 마이그레이션 계정: 테이블 생성·변경(DDL) 권한. 앱 계정과 분리해 앱이 테이블을 바꾸지 못하게 한다
  flyway:
    user: ${DB_MIGRATION_USERNAME:ai_lms_migrator}
    password: ${DB_MIGRATION_PASSWORD}

app:
  jwt:
    # 로컬도 .env의 고정 키를 쓴다 (서버를 다시 띄워도 로그인이 유지되게)
    allow-ephemeral-secret: false
