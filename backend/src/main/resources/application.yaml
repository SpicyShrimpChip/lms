spring:
  application:
    name: backend
  # 로컬: H2(메모리). MySQL과 비슷하게 동작하도록 MODE=MySQL을 쓴다. 운영은 application-prod.yaml 참고
  datasource:
    url: jdbc:h2:mem:lms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    # data.sql(샘플 데이터)을 테이블이 만들어진 뒤에 실행한다
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always

server:
  port: 8080

app:
  cors:
    # 프론트를 다른 도메인에서 직접 부를 때만 필요하다 (같은 출처면 무관)
    allowed-origins: http://localhost:5173
  storage:
    local-dir: uploads
